name: Send GodMorgenSarpsborg-daglig

on:
  schedule:
    # 07:00 UTC = 09:00 norsk sommertid
    - cron: '0 7 * * *'
    # 08:00 UTC = 09:00 norsk vintertid
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Sjekk om riktig cron for norsk tid
        id: norsk_tid
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "skal_kjore=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.run_attempt }}" != "1" ]; then
            echo "Dette er et manuelt re-run av en schedule-kjøring. Kjører videre."
            echo "skal_kjore=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          trigger="${{ github.event.schedule }}"
          norsk_offset="$(TZ=Europe/Oslo date +%z)"
          norsk_tid="$(TZ=Europe/Oslo date '+%Y-%m-%d %H:%M %Z')"

          echo "Planlagt cron: $trigger"
          echo "Norsk tid nå: $norsk_tid"
          echo "Norsk UTC-offset: $norsk_offset"

          if [ "$trigger" = "0 7 * * *" ] && [ "$norsk_offset" = "+0200" ]; then
            echo "skal_kjore=true" >> "$GITHUB_OUTPUT"
          elif [ "$trigger" = "0 8 * * *" ] && [ "$norsk_offset" = "+0100" ]; then
            echo "skal_kjore=true" >> "$GITHUB_OUTPUT"
          else
            echo "skal_kjore=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sjekk ut kode
        if: steps.norsk_tid.outputs.skal_kjore == 'true'
        uses: actions/checkout@v6

      - name: Sett opp Python
        if: steps.norsk_tid.outputs.skal_kjore == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Installer avhengigheter
        if: steps.norsk_tid.outputs.skal_kjore == 'true'
        run: pip install -r requirements.txt

      - name: Kjør tester
        if: steps.norsk_tid.outputs.skal_kjore == 'true'
        run: python -m unittest discover -s tests

      - name: Kjør script
        if: steps.norsk_tid.outputs.skal_kjore == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER || 'redaksjonen@sa.no' }}
        run: python GodMorgenSarpsborg.py
